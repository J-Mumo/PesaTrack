# PesaTrack API — Docker Compose (Hetzner multi-app deploy)
# See plans/ai-pro-phase1-spec.md §4.2

name: pesatrack-api

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - web
    # Prisma migrations run on every deploy — safe because they're idempotent.
    command: sh -c "npx prisma migrate deploy && node src/index.js"
    # Google Play Developer API credentials — mounted at
    # /run/secrets/play_service_account.json inside the container, which
    # matches GOOGLE_PLAY_SERVICE_ACCOUNT_JSON in .env.example. Compose
    # bind-mounts the source file read-only with restrictive perms.
    #
    # ROTATION: replace ./play_service_account.json on the host with the
    # new key from GCP → `docker compose up -d web` (no rebuild required)
    # → `curl https://pesatrack-api.jmumo.com/health` to confirm boot →
    # revoke old key in GCP. Nothing else moves.
    secrets:
      - play_service_account.json
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pesatrack_api
      POSTGRES_USER: pesatrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pesatrack -d pesatrack_api"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db_data:

# Docker Compose secrets. Source file lives on the host (never committed
# — see backend/.gitignore) and is bind-mounted into the container at
# /run/secrets/<secret-name>. In our case the secret is named exactly
# `play_service_account.json` so the in-container path is
# `/run/secrets/play_service_account.json`, matching the default
# GOOGLE_PLAY_SERVICE_ACCOUNT_JSON in .env.example.
secrets:
  play_service_account.json:
    file: ./play_service_account.json

networks:
  default:
  web:
    external: true
