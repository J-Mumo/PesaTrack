# PesaTrack API — Docker Compose (Hetzner multi-app deploy)
# See plans/ai-pro-phase1-spec.md §4.2

name: pesatrack-api

services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - web
    # Prisma migrations run on every deploy — safe because they're idempotent.
    command: sh -c "npx prisma migrate deploy && node src/index.js"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pesatrack_api
      POSTGRES_USER: pesatrack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pesatrack -d pesatrack_api"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db_data:

networks:
  default:
  web:
    external: true
